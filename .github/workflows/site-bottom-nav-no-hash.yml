name: site-bottom-nav-no-hash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-bottom-nav-no-hash.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace bottom nav hashes with JS scrolling
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          PATCH_ID = 'PHQ-SITE-BOTTOM-NAV-NO-HASH-2026-09-05-01'

          hp = Path('index.html')
          jp = Path('assets/page-kjCTkZIS.js')
          cp = Path('assets/index-C-szeJ12.css')
          mp = Path('SITE_SYNC_MANIFEST.json')

          html = hp.read_text()
          page = jp.read_text()
          css = cp.read_text()

          # Static pre-rendered bottom nav only. Other in-page links are intentionally untouched.
          old_static = '<div class="bottom"><nav aria-label="行程快速導覽"><a href="#today"><span>☀️</span>今天</a><a href="#slots"><span>🧩</span>排牌</a><a href="#cards"><span>🗺️</span>Cards</a><a href="#food"><span>🍜</span>吃飯</a><a href="#rules"><span>⚡</span>T−72</a></nav></div>'
          new_static = '<div class="bottom"><nav aria-label="行程快速導覽"><button type="button" data-scroll-target="today"><span>☀️</span>今天</button><button type="button" data-scroll-target="slots"><span>🧩</span>排牌</button><button type="button" data-scroll-target="cards"><span>🗺️</span>Cards</button><button type="button" data-scroll-target="food"><span>🍜</span>吃飯</button><button type="button" data-scroll-target="rules"><span>⚡</span>T−72</button></nav></div>'
          if old_static not in html:
              raise SystemExit('static bottom nav source mismatch')
          html = html.replace(old_static, new_static, 1)

          # Hydrated React bottom nav. Prefixes are unique to the five fixed nav items.
          js_repls = {
              '(0,j.jsxs)(`a`,{href:`#today`,children:': '(0,j.jsxs)(`button`,{type:`button`,`data-scroll-target`:`today`,children:',
              '(0,j.jsxs)(`a`,{href:`#slots`,children:': '(0,j.jsxs)(`button`,{type:`button`,`data-scroll-target`:`slots`,children:',
              '(0,j.jsxs)(`a`,{href:`#cards`,children:': '(0,j.jsxs)(`button`,{type:`button`,`data-scroll-target`:`cards`,children:',
              '(0,j.jsxs)(`a`,{href:`#food`,children:': '(0,j.jsxs)(`button`,{type:`button`,`data-scroll-target`:`food`,children:',
              '(0,j.jsxs)(`a`,{href:`#rules`,children:': '(0,j.jsxs)(`button`,{type:`button`,`data-scroll-target`:`rules`,children:',
          }
          for old, new in js_repls.items():
              count = page.count(old)
              if count != 1:
                  raise SystemExit(f'hydrated bottom nav source mismatch ({old}): {count}')
              page = page.replace(old, new, 1)

          # Preserve visual styling while changing semantic element from anchor to button.
          css_repls = {
              '.bottom a{text-align:center;color:var(--muted);border-radius:11px;padding:7px 3px;font-size:11px;font-weight:800;text-decoration:none}': '.bottom button{text-align:center;color:var(--muted);border:0;background:transparent;border-radius:11px;width:100%;padding:7px 3px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}',
              '.bottom a:focus-visible,.bottom a:hover{color:var(--green);background:#fffc;outline:none}': '.bottom button:focus-visible,.bottom button:hover{color:var(--green);background:#fffc;outline:none}',
              '.bottom a span{margin-bottom:2px;font-size:19px;line-height:1.1;display:block}': '.bottom button span{margin-bottom:2px;font-size:19px;line-height:1.1;display:block}',
          }
          for old, new in css_repls.items():
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'bottom nav CSS source mismatch: {count}')
              css = css.replace(old, new, 1)

          nav_script = '''<script id="bottom-nav-no-hash">(function(){function clearOldHash(){if(location.hash&&!location.hash.startsWith('#food-'))history.replaceState(null,'',location.pathname+location.search)}document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.bottom nav [data-scroll-target]');if(!b)return;var id=b.getAttribute('data-scroll-target'),el=id&&document.getElementById(id);if(!el)return;e.preventDefault();clearOldHash();var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});if(b.blur)b.blur()});if(location.hash&&!location.hash.startsWith('#food-'))setTimeout(clearOldHash,60)})();</script>'''
          if 'id="bottom-nav-no-hash"' not in html:
              marker = '<script id="food-hash-unlock">'
              if marker not in html:
                  raise SystemExit('food hash script marker missing')
              html = html.replace(marker, nav_script + marker, 1)

          # Assert bottom nav no longer writes hashes, while Food region deep-links remain intact.
          bottom = html.split('<div class="bottom">', 1)[1].split('</nav>', 1)[0]
          if 'href="#' in bottom or '<a ' in bottom:
              raise SystemExit('static bottom nav still contains hash anchor')
          for target in ('today','slots','cards','food','rules'):
              if f'data-scroll-target="{target}"' not in bottom:
                  raise SystemExit(f'missing static nav target: {target}')
              if f'`data-scroll-target`:`{target}`' not in page:
                  raise SystemExit(f'missing hydrated nav target: {target}')
          for old in js_repls:
              if old in page:
                  raise SystemExit(f'hydrated bottom nav hash remains: {old}')
          if '#food-grandworld' not in html or '#food-grandworld' not in page:
              raise SystemExit('Food deep-link regression')
          if 'id="food-hash-unlock"' not in html:
              raise SystemExit('Food open/unlock script regression')

          hp.write_text(html)
          jp.write_text(page)
          cp.write_text(css)

          manifest = json.loads(mp.read_text())
          manifest['bottom_nav_behavior_patch'] = PATCH_ID
          manifest['bottom_nav_navigation'] = 'JS_SCROLL_INTO_VIEW_NO_HASH'
          manifest['bottom_nav_hash_persistence'] = 'NONE'
          manifest['food_queue_anchor_policy'] = 'OPEN_TARGET_SCROLL_THEN_CLEAR_HASH'
          manifest['canonical_cutover'] = False
          mp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          print('BOTTOM_NAV_NO_HASH_PATCH=PASS')
          PY

          node --check assets/page-kjCTkZIS.js

      - name: Commit staging bottom nav fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/page-kjCTkZIS.js assets/index-C-szeJ12.css SITE_SYNC_MANIFEST.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git commit -m 'Use no-hash bottom navigation'
          git push origin HEAD:main

      - name: Verify public Pages staging
        run: |
          set -euo pipefail
          base='https://ga815647.github.io/phu-quoc-2026-mobile'
          ok=0
          for i in $(seq 1 36); do
            echo "Attempt $i"
            if curl -fsSL --retry 2 --connect-timeout 10 "$base/?sync=PHQ-SITE-BOTTOM-NAV-NO-HASH-2026-09-05-01-$i" -o /tmp/live.html; then
              page_asset=$(grep -o './assets/page-[A-Za-z0-9_-]*\.js' /tmp/live.html | head -1 | sed 's#^\./##')
              if [ -n "$page_asset" ]; then
                curl -fsSL --retry 2 "$base/$page_asset?sync=$i" -o /tmp/page.js || true
                python - <<'PY'
          from pathlib import Path
          h = Path('/tmp/live.html').read_text()
          j = Path('/tmp/page.js').read_text()
          good = True
          try:
              bottom = h.split('<div class="bottom">',1)[1].split('</nav>',1)[0]
          except Exception:
              good = False
              bottom = ''
          for t in ('today','slots','cards','food','rules'):
              good = good and f'data-scroll-target="{t}"' in bottom
              good = good and f'`data-scroll-target`:`{t}`' in j
          good = good and 'href="#' not in bottom and '<a ' not in bottom
          good = good and 'id="bottom-nav-no-hash"' in h
          good = good and 'id="food-hash-unlock"' in h
          good = good and '#food-grandworld' in h and '#food-grandworld' in j
          Path('/tmp/verify-ok').write_text('1' if good else '0')
          PY
                if [ "$(cat /tmp/verify-ok)" = 1 ]; then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          echo 'LIVE_STAGING_BOTTOM_NAV_NO_HASH_VERIFY=PASS'
