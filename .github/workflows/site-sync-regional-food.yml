          new_vin_js = '''(0,j.jsxs)(`article`,{className:`card`,id:`vinwonders`,children:[(0,j.jsxs)(`div`,{className:`chead`,children:[(0,j.jsx)(`div`,{className:`kicker`,children:`CARD B · CORE`}),(0,j.jsx)(`h3`,{children:`🎢 VinWonders + optional Grand World`}),(0,j.jsx)(`p`,{className:`summary`,children:`Central dynamic breakfast → VinWonders。Sea Shell first；Grand World 只有刻意提早離園且孩子還有力才接。`}),(0,j.jsxs)(`div`,{className:`tags`,children:[(0,j.jsx)(`span`,{className:`tag`,children:`核心`}),(0,j.jsx)(`span`,{className:`tag orange`,children:`Heavy`}),(0,j.jsx)(`span`,{className:`tag gray`,children:`GW optional`})]})]}),(0,j.jsxs)(`div`,{className:`timeline`,children:[(0,j.jsx)($,{time:`Breakfast`,title:`Central dynamic queue`,children:`不再固定 Út Lượm + Dương Đông Market；依 operating window、未吃過的 A-dish 與摩擦選早餐。`}),(0,j.jsx)($,{time:`09:15–09:35`,title:`VinWonders main gate`,children:`Direct car primary；安檢／票券後自然接 Sea Shell 與園內 parent content。`}),(0,j.jsx)($,{time:`10:00`,title:`Sea Shell first`,children:`先做全齡、高確定性內容，再依 115 cm 與孩子狀態選其他區域。`}),(0,j.jsx)($,{time:`Normal / tired exit`,title:`園內先把餐解決`,children:`正常離園或孩子已累，不為吃飯強接 Grand World；現行園內餐飲 window T−72/T−1 重查。`}),(0,j.jsx)($,{time:`Early exit only`,title:`Optional Grand World`,children:`孩子 Green 才接；Bếp Nhà 是 VERIFY execution fallback #1，Cơm Nhà secondary，兩者都不是 production Carrier。`})]}),(0,j.jsxs)(`details`,{className:`ops`,children:[(0,j.jsx)(`summary`,{children:`交通／return／Food`}),(0,j.jsx)(`div`,{className:`inside`,children:(0,j.jsxs)(`ul`,{children:[(0,j.jsx)(`li`,{children:`Direct car primary；VinBus 只在 live ETA 與 T2 internal 接駁清楚時用。`}),(0,j.jsx)(`li`,{children:`Grand World 不是成功條件；走不動就離開。`}),(0,j.jsx)(`li`,{children:`Food 只降低 evening failure risk，不把 Grand World 升成 Food destination。`})]})})]}),(0,j.jsx)(`div`,{className:`callout blue`,children:`正常／child-tired：園內吃 → 撤。只有 early exit + child Green 才接 Grand World。`})]})'''
