          new_callout = '需要休息時直接做 <strong>free／recovery day</strong>。它是狀態，不是第六張 Card。An Thới 只保留 optional satellite；Khem 不再是 Cable default satellite。'
          html = once(html, old_callout, new_callout, 'HTML cards callout')
