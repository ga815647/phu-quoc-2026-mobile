trong`,{children:`先砍：`}),`An Thới Market + Harbour optional satellite。`]}),(0,j.jsxs)(`li`,{children:[(0,j.jsx)(`strong`,{children:`再砍：`}),`任何 VERIFY food hunting。`]}),(0,j.jsxs)(`li`,{children:[(0,j.jsx)(`strong`,{children:`保留：`}),`Cable + Sunset Town 與必要吃飯 buffer。`]})]})]}),(0,j.jsxs)(`details`,{className:`ops`,children:[(0,j.jsx)(`summary`,{children:`T−72 / execution`}),(0,j.jsx)(`div`,{className:`inside`,children:(0,j.jsxs)(`ul`,{children:[(0,j.jsx)(`li`,{children:`T−72：October first-wave exact hours、return／last run、maintenance／weather。`}),(0,j.jsx)(`li`,{children:`T−1：selected breakfast 實開／售罄、An Thới Market closing、selected dinner operation。`}),(0,j.jsx)(`li`,{children:`Khem 不再是 default satellite；只有 live conditions unusually strong 且不擠掉更高 priority 時才重考慮。`})]})})]}),(0,j.jsx)(`div`,{className:`callout blue`,children:`Food 不改 Cable Mandatory。早餐用 regional dynamic queue；An Thới 是 optional，不是 standalone Card。`})]})'''
