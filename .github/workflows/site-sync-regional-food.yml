name: site-sync-regional-food

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-sync-regional-food.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply accepted five-card + regional-food staging sync
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          root = Path('.')
          hp = root / 'index.html'
          jp = root / 'assets/page-kjCTkZIS.js'
          html = hp.read_text()
          page = jp.read_text()

          def once(s, old, new, label):
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {c}')
              return s.replace(old, new, 1)

          def replace_between(s, start, end, new, label):
              i = s.find(start)
              if i < 0:
                  raise SystemExit(f'{label}: start marker not found')
              j = s.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return s[:i] + new + s[j:]

          # Global route-state labels / selector inventory.
          html = html.replace('1 大 1 小、Cosy Bungalow 單一基地的六卡彈性行程與交通執行系統。',
                              '1 大 1 小、Cosy Bungalow 單一基地的五卡彈性行程與區域餐食執行系統。')
          html = once(html, 'PHU QUOC · SIX-CARD EXECUTION', 'PHU QUOC · FIVE-CARD EXECUTION', 'HTML hero mode')
          page = once(page, 'PHU QUOC · SIX-CARD EXECUTION', 'PHU QUOC · FIVE-CARD EXECUTION', 'PAGE hero mode')

          old_cards = "_u=[[`onbird`,`🤿 OnBird`],[`vinwonders`,`🎢 VinWonders`],[`cable`,`🚠 Cable + Sunset Town`],[`anthoi`,`🛒 An Thới South-East Loop`],[`starfish`,`⭐ 海星｜Rạch Vẹm / Hàm Rồng`],[`safari`,`🦒 Safari`]]"
          new_cards = "_u=[[`onbird`,`🤿 OnBird`],[`vinwonders`,`🎢 VinWonders`],[`cable`,`🚠 Cable + Sunset Town`],[`starfish`,`⭐ 海星｜Rạch Vẹm / Hàm Rồng`],[`safari`,`🦒 Safari`]]"
          page = once(page, old_cards, new_cards, 'PAGE card inventory')

          html = once(html, '<h2>6 張 Day Cards</h2><span>只有六張</span>', '<h2>5 張 Day Cards</h2><span>只有五張</span>', 'HTML cards heading')
          page = once(page, 'title:`6 張 Day Cards`,note:`只有六張`', 'title:`5 張 Day Cards`,note:`只有五張`', 'PAGE cards heading')
          page = once(page, 'children:`6 張 Day Cards`', 'children:`5 張 Day Cards`', 'PAGE selector group')

