name: Install repo-local design skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-design-skills-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Anthropic frontend-design skill and provenance
        run: |
          set -euo pipefail
          ANTHROPIC_REF='41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f'
          mkdir -p .agents/skills/frontend-design
          curl -fsSL "https://raw.githubusercontent.com/anthropics/skills/${ANTHROPIC_REF}/skills/frontend-design/SKILL.md" -o .agents/skills/frontend-design/SKILL.md
          curl -fsSL "https://raw.githubusercontent.com/anthropics/skills/${ANTHROPIC_REF}/skills/frontend-design/LICENSE.txt" -o .agents/skills/frontend-design/LICENSE.txt
          cat > .agents/skills/frontend-design/UPSTREAM.md <<EOF
          # Upstream provenance

          - Source: https://github.com/anthropics/skills
          - Ref: ${ANTHROPIC_REF}
          - Path: skills/frontend-design
          - License: Apache-2.0 (see LICENSE.txt)
          - Vendored without modification.
          EOF
          cat > .agents/README.md <<'EOF'
          # Repo-local design tools

          Codex automatically discovers repo skills under `.agents/skills`.

          - `frontend-design` is vendored from Anthropic's official skills repository at a pinned commit. It is used for visual direction, typography, hierarchy, copy, restraint, and self-critique.
          - OpenAI's proprietary `product-design` plugin is not copied into this repository. `.agents/plugins/marketplace.json` exposes the official pinned Git subdirectory as a repo marketplace entry instead.

          The Product Design plugin includes screenshot-backed UX audit workflows. In ChatGPT desktop / Codex surfaces that support repo marketplaces, restart the app if needed, open the Plugins Directory, select `Phu Quoc 2026 Design Tools`, and install `Product Design`.

          Keep the deterministic Playwright smoke checks even when using design skills: design review and regression testing serve different purposes.
          EOF
          git add .agents
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vendor repo-local frontend design skill'
          git push
