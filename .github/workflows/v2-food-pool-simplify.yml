          cat > v2-food-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://ga815647.github.io/phu-quoc-2026-mobile/v2.html?food-smoke=1',{waitUntil:'networkidle'});
            await page.waitForTimeout(500);
            const txt=await page.locator('body').innerText();
            if(!txt.includes('美食 Pool')||!txt.includes('Bún Kèn Út Lượm')||!txt.includes('已吃 0 / 18'))throw new Error('pool render missing');
            if(await page.locator('[data-food-id]').count()!==18)throw new Error('pool item count wrong');
            await page.locator('[data-jump="food"]').click();
            await page.waitForTimeout(120);
            const nav=await page.evaluate(()=>({hash:location.hash,top:document.getElementById('food').getBoundingClientRect().top}));
            if(nav.hash||Math.abs(nav.top)>90)throw new Error('food nav failed '+JSON.stringify(nav));
            const first=page.locator('[data-food-id="bun-ken-ut-luom"] .eaten-btn');
            await first.click();await page.waitForTimeout(80);
            if((await first.textContent()).trim()!=='✓ 吃過')throw new Error('eaten toggle failed');
            await page.reload({waitUntil:'networkidle'});await page.waitForTimeout(300);
            if(!(await page.locator('[data-food-id="bun-ken-ut-luom"]').evaluate(el=>el.classList.contains('eaten'))))throw new Error('eaten persistence failed');
            await page.locator('#resetFood').click();await page.waitForTimeout(80);
            if(!(await page.locator('#foodProgress').innerText()).includes('0 / 18'))throw new Error('reset failed');
            if(errors.length)throw new Error('pageerror '+errors.join(' | '));
            console.log('V2_FOOD_POOL_MOBILE=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node v2-food-smoke.cjs
