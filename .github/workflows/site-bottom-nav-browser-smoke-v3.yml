name: site-bottom-nav-browser-smoke-v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-bottom-nav-browser-smoke-v3.yml'

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for instant-nav artifact
        run: |
          set -euo pipefail
          base='https://ga815647.github.io/phu-quoc-2026-mobile'
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL "$base/?smoke=instant-$i" -o /tmp/live.html \
               && grep -q "root.style.scrollBehavior='auto'" /tmp/live.html; then ok=1; break; fi
            sleep 8
          done
          test "$ok" = 1
      - name: Chromium mobile render and free-scroll smoke
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > mobile-smoke-v3.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page = await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://ga815647.github.io/phu-quoc-2026-mobile/?browser-smoke=bottom-nav-05',{waitUntil:'networkidle'});
            await page.waitForTimeout(800);
            const text=await page.locator('body').innerText();
            const bodyHeight=await page.evaluate(()=>document.documentElement.scrollHeight);
            if(!text.includes('富國島 2026')||!text.includes('區域 Food Queue')||bodyHeight<2000) throw new Error('render failure '+bodyHeight);
            const fatal=errors.filter(x=>!x.includes('Minified React error #418')); if(fatal.length) throw new Error(fatal.join(' | '));

            await page.locator('.bottom nav a[href="#food"]').click();
            await page.waitForTimeout(120);
            const s1=await page.evaluate(()=>({hash:location.hash,y:scrollY,top:document.getElementById('food').getBoundingClientRect().top}));
            if(s1.hash||Math.abs(s1.top)>80) throw new Error('food nav failed '+JSON.stringify(s1));
            await page.evaluate(()=>window.scrollBy(0,320)); await page.waitForTimeout(500);
            const s2=await page.evaluate(()=>({hash:location.hash,y:scrollY}));
            if(s2.hash||s2.y<s1.y+180) throw new Error('free scroll failed '+JSON.stringify({s1,s2}));

            await page.locator('.bottom nav a[href="#today"]').click();
            await page.waitForTimeout(120);
            const s3=await page.evaluate(()=>({hash:location.hash,y:scrollY,top:document.getElementById('today').getBoundingClientRect().top}));
            if(s3.hash||Math.abs(s3.top)>80) throw new Error('today nav failed '+JSON.stringify(s3));
            await page.evaluate(()=>window.scrollBy(0,260)); await page.waitForTimeout(500);
            const s4=await page.evaluate(()=>({hash:location.hash,y:scrollY}));
            if(s4.y<s3.y+140) throw new Error('second free scroll failed '+JSON.stringify({s3,s4}));
            console.log('MOBILE_INSTANT_NAV=PASS',JSON.stringify({bodyHeight,react418:errors.filter(x=>x.includes('Minified React error #418')).length,s1,s2,s3,s4}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node mobile-smoke-v3.cjs
