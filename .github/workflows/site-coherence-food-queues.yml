name: site-coherence-food-queues

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-coherence-food-queues.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Grand World hash scroll hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old_note = '只有刻意提早離園、孩子還有力才接；不要為了晚餐單獨硬加 Grand World。'
          new_note = '只有刻意提早離園、孩子還有力才接；Grand World Queue 就在本區下方，直接往下滑即可，不要為了晚餐單獨硬加 Grand World。'

          # Keep the patch generator from reintroducing the problematic deep link.
          tp = Path('tools/site_coherence_patch.py')
          tool = tp.read_text()
          tool = tool.replace('"id": "food-grandworld",', '"id": "food-grandworld-panel",', 1)
          tool = tool.replace(',"jump":["看 Grand World Queue","#food-grandworld"]', '')
          tool = tool.replace(old_note, new_note, 1)
          if '#food-grandworld' in tool:
              raise SystemExit('stale Grand World hash remains in generator')
          tp.write_text(tool)

          # Static pre-rendered HTML.
          hp = Path('index.html')
          html = hp.read_text()
          html = html.replace('id="food-grandworld"', 'id="food-grandworld-panel"', 1)
          html = html.replace('<a class="pq-btn queue-jump" href="#food-grandworld">↳ 看 Grand World Queue</a>', '<span class="queue-inline">Grand World Queue 在下方</span>', 1)
          html = html.replace(old_note, new_note, 1)
          if '#food-grandworld' in html or 'id="food-grandworld"' in html:
              raise SystemExit('stale Grand World hash target remains in static HTML')
          hp.write_text(html)

          # Hydrated client data.
          jp = Path('assets/page-kjCTkZIS.js')
          page = jp.read_text()
          page = page.replace('{"id":"food-grandworld","title"', '{"id":"food-grandworld-panel","title"', 1)
          page = page.replace(',"jump":["看 Grand World Queue","#food-grandworld"]', '')
          page = page.replace(old_note, new_note, 1)
          if '#food-grandworld' in page or 'id:`food-grandworld`' in page:
              raise SystemExit('stale Grand World hash target remains in hydrated client')
          jp.write_text(page)

          mp = Path('SITE_SYNC_MANIFEST.json')
          manifest = json.loads(mp.read_text())
          manifest['food_queue_scroll_hotfix'] = 'PHQ-SITE-FOOD-HASH-SCROLL-HOTFIX-2026-09-05-01'
          manifest['food_queue_anchor_policy'] = 'NO_HASH_DEEP_LINK_FOR_COLLAPSIBLE_GRANDWORLD_PANEL'
          manifest['canonical_cutover'] = False
          mp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY

          node --check assets/page-kjCTkZIS.js

      - name: Commit staging scroll hotfix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/site_coherence_patch.py index.html assets/page-kjCTkZIS.js SITE_SYNC_MANIFEST.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git commit -m 'Fix Grand World food queue hash scroll'
          git push origin HEAD:main

      - name: Verify public Pages staging
        run: |
          set -euo pipefail
          base='https://ga815647.github.io/phu-quoc-2026-mobile'
          ok=0
          for i in $(seq 1 30); do
            echo "Attempt $i"
            if curl -fsSL --retry 2 --connect-timeout 10 "$base/?sync=PHQ-SITE-FOOD-HASH-SCROLL-HOTFIX-2026-09-05-01-$i" -o /tmp/live.html; then
              page_asset=$(grep -o './assets/page-[A-Za-z0-9_-]*\.js' /tmp/live.html | head -1 | sed 's#^\./##')
              if [ -n "$page_asset" ]; then
                curl -fsSL --retry 2 "$base/$page_asset?sync=$i" -o /tmp/page.js || true
                if grep -q 'food-grandworld-panel' /tmp/live.html \
                   && grep -q 'food-grandworld-panel' /tmp/page.js \
                   && grep -q 'Grand World Queue 就在本區下方' /tmp/live.html \
                   && ! grep -q '#food-grandworld' /tmp/live.html \
                   && ! grep -q '#food-grandworld' /tmp/page.js \
                   && ! grep -q 'id="food-grandworld"' /tmp/live.html; then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          echo 'LIVE_STAGING_SCROLL_HOTFIX_VERIFY=PASS'
