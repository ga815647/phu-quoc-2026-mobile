name: site-bottom-nav-browser-smoke-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-bottom-nav-browser-smoke-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chromium mobile render and free-scroll smoke
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > mobile-smoke-v2.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('https://ga815647.github.io/phu-quoc-2026-mobile/?browser-smoke=bottom-nav-04', {waitUntil:'networkidle'});
            await page.waitForTimeout(900);

            const text = await page.locator('body').innerText();
            const bodyHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            if (!text.includes('富國島 2026') || !text.includes('區域 Food Queue')) throw new Error('rendered content missing');
            if (bodyHeight < 2000) throw new Error('blank/short page: ' + bodyHeight);
            const fatalErrors = errors.filter(x => !x.includes('Minified React error #418'));
            if (fatalErrors.length) throw new Error('unexpected pageerror: ' + fatalErrors.join(' | '));

            await page.locator('.bottom nav a[href="#food"]').click();
            await page.waitForTimeout(300);
            const s1 = await page.evaluate(() => ({hash:location.hash,y:scrollY,top:document.getElementById('food').getBoundingClientRect().top}));
            if (s1.hash) throw new Error('hash persisted after food tap: ' + s1.hash);
            if (Math.abs(s1.top) > 80) throw new Error('food target misaligned: ' + JSON.stringify(s1));

            await page.evaluate(() => window.scrollBy(0,320));
            await page.waitForTimeout(700);
            const s2 = await page.evaluate(() => ({hash:location.hash,y:scrollY}));
            if (s2.hash) throw new Error('hash reappeared after free scroll: ' + s2.hash);
            if (s2.y < s1.y + 180) throw new Error('scroll stuck/snapped back: ' + JSON.stringify({s1,s2}));

            await page.locator('.bottom nav a[href="#today"]').click();
            await page.waitForTimeout(300);
            const s3 = await page.evaluate(() => ({hash:location.hash,y:scrollY,top:document.getElementById('today').getBoundingClientRect().top}));
            if (s3.hash) throw new Error('hash persisted after today tap: ' + s3.hash);
            if (Math.abs(s3.top) > 80) throw new Error('today target misaligned: ' + JSON.stringify(s3));

            await page.evaluate(() => window.scrollBy(0,260));
            await page.waitForTimeout(700);
            const s4 = await page.evaluate(() => ({hash:location.hash,y:scrollY}));
            if (s4.y < s3.y + 140) throw new Error('scroll stuck after second nav: ' + JSON.stringify({s3,s4}));

            console.log('MOBILE_RENDER_FREE_SCROLL=PASS', JSON.stringify({bodyHeight,react418:errors.filter(x=>x.includes('Minified React error #418')).length,s1,s2,s3,s4}));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node mobile-smoke-v2.cjs
