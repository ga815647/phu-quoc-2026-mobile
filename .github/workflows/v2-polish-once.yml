name: Apply V2 usability polish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only v2.html
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('v2.html')
          s=p.read_text(encoding='utf-8')
          def repl(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)

          repl('.hero{padding:34px 4px 17px}', '.hero{padding:24px 4px 13px}', 'hero padding')
          repl('.hero h1{margin:9px 0 8px;font-size:clamp(34px,9vw,54px);line-height:1.02;letter-spacing:-.045em}', '.hero h1{margin:7px 0 7px;font-size:clamp(30px,8vw,48px);line-height:1.02;letter-spacing:-.045em}', 'hero title')
          repl('.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}', '.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}', 'hero grid')
          repl('.status{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);border-radius:18px;padding:14px}', '.status{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);border-radius:18px;padding:12px}', 'status padding')
          repl('.status strong{display:block;font-size:20px;margin-top:2px}', '.status strong{display:block;font-size:18px;margin-top:2px}', 'status title')

          repl('.nav button{border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:12px;font-size:13px;font-weight:780}', '.nav button{min-height:44px;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:12px;font-size:13px;font-weight:780}', 'nav touch')
          repl('select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;color:var(--ink)}', 'select{width:100%;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;color:var(--ink)}', 'select touch')
          repl('.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 12px;font-weight:780}', '.ghost{min-height:44px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 12px;font-weight:780}', 'ghost touch')
          repl('.place-link{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:11px;font-weight:850;color:var(--brand)}', '.place-link{min-height:44px;display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:850;color:var(--brand)}', 'place link touch')
          repl('.map,.eaten-btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 9px;font-size:11px;font-weight:850;color:var(--brand)}', '.map,.eaten-btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;font-size:12px;font-weight:850;color:var(--brand)}', 'food touch')

          repl('.food-card.eaten{opacity:.5;background:#f1f3ef}', '.food-card.eaten{opacity:.72;background:#f1f3ef;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;padding:10px 12px}.food-card.eaten .food-meta,.food-card.eaten .food-order,.food-card.eaten .food-desc,.food-card.eaten .map{display:none}.food-card.eaten .food-rank{width:30px;height:30px;border-radius:10px}', 'eaten collapse')
          repl('.food-actions{grid-column:2;justify-content:flex-start}', '.food-actions{grid-column:2;justify-content:flex-start}.food-card.eaten{grid-template-columns:34px minmax(0,1fr) auto}.food-card.eaten .food-actions{grid-column:auto}', 'mobile eaten')

          nav_old="document.querySelectorAll('[data-jump]').forEach(btn=>btn.addEventListener('click',()=>{const el=document.getElementById(btn.dataset.jump);if(!el)return;const y=el.getBoundingClientRect().top+window.scrollY-(sticky.offsetHeight+8);window.scrollTo(0,Math.max(0,y));document.querySelectorAll('[data-jump]').forEach(x=>x.classList.remove('primary'));btn.classList.add('primary')}));"
          nav_new="""const navButtons=[...document.querySelectorAll('[data-jump]')];
          const navIds=navButtons.map(btn=>btn.dataset.jump);
          function setActiveNav(id){navButtons.forEach(btn=>btn.classList.toggle('primary',btn.dataset.jump===id))}
          function syncNav(){const offset=sticky.offsetHeight+18;let current=navIds[0];navIds.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<=offset)current=id});setActiveNav(current)}
          navButtons.forEach(btn=>btn.addEventListener('click',()=>{const el=document.getElementById(btn.dataset.jump);if(!el)return;const y=el.getBoundingClientRect().top+window.scrollY-(sticky.offsetHeight+8);window.scrollTo(0,Math.max(0,y));setActiveNav(btn.dataset.jump);requestAnimationFrame(syncNav)}));
          let navTick=false;window.addEventListener('scroll',()=>{if(navTick)return;navTick=true;requestAnimationFrame(()=>{syncNav();navTick=false})},{passive:true});window.addEventListener('resize',syncNav);syncNav();"""
          repl(nav_old,nav_new,'nav sync')

          repl("document.getElementById('resetSlots').addEventListener('click',()=>{saved={};localStorage.removeItem(slotKey);document.querySelectorAll('select[data-day]').forEach(s=>s.value='')});", "document.getElementById('resetSlots').addEventListener('click',()=>{if(!window.confirm('清除所有暫排行程？'))return;saved={};localStorage.removeItem(slotKey);document.querySelectorAll('select[data-day]').forEach(s=>s.value='')});", 'slot confirm')
          repl("document.getElementById('resetFood').addEventListener('click',()=>{eaten={};localStorage.removeItem(foodKey);renderFood()});", "document.getElementById('resetFood').addEventListener('click',()=>{if(!window.confirm('清除所有「吃過」紀錄？'))return;eaten={};localStorage.removeItem(foodKey);renderFood()});", 'food confirm')

          for old,new in {
            'actual pickup window、daily sea condition、go / reschedule；現場保留 safety assessment。':'接送時間、當天海況、是否照常出發；現場仍依教練安全評估。',
            'October first-wave exact hours、return / last run、maintenance、weather。':'10 月第一波纜車時段、回程／末班、是否維修、天氣。',
            '園內餐飲 window、direct quote、child eligibility；GW 仍 optional。':'園區營業與餐飲時段、票價／直訂價格、兒童設施限制；Grand World 仍是有體力才接。',
            '七項 hard gate + 48h road / starfish / water evidence。':'前 48 小時確認路況、海星、水色、船與回程；七項條件全過才去。',
            'official hours、direct car、tail return；Gành Dầu retained driver + 17:00 hard leave。':'營業時間、直達叫車與北島回程；若去 Gành Dầu，先把回程車談好並在 17:00 前離開。',
            '只查明天實際會用到的候選：營業、庫存、價格；真正決定時直接問 ChatGPT。':'只查明天可能吃的店：是否營業、想點的東西有沒有、價格；真的要吃時再問 ChatGPT。',
            '<b>T−1 建議 15:00–17:00：</b>只鎖明天。若 booking、官方停駛／閉園、returnability、住宿、孩子 eligibility 都沒變，就不要重開整個 route。':'<b>前一天下午 15:00–17:00：</b>只確認明天。若預約、官方營運、回程交通、住宿與孩子限制都沒變，就不要重新研究整趟。',
            '<b>Central / Cosy + 大節點</b><span>Grab／GreenSM／taxi 三層互備；Airport、Ga Ánh Dương、VinWonders、Safari 優先 direct car。</span>':'<b>市區／主要景點</b><span>Grab／GreenSM／taxi 都可；機場、Ga Ánh Dương、VinWonders、Safari 直接叫車。</span>',
            '<b>偏遠點／多停點</b><span>先鎖回程；無可靠 return 就 skip。</span>':'<b>偏遠地點／多停點</b><span>出發前先確認回程；回程沒把握就不去。</span>',
            '<b>App 叫不到</b><span>5–10 分未指派就切另一 app／taxi；bus ETA &gt;15–20 分直接切 direct。</span>':'<b>App 叫不到</b><span>5–10 分鐘還沒派車就換另一個 app 或 taxi；巴士還要等 15–20 分鐘以上就改叫車。</span>',
            '<b>孩子</b><span>約 115 cm，一律後排；長程車優先三點式安全帶＋booster／child seat。</span>':'<b>孩子</b><span>約 115 cm，全程後座；長程優先三點式安全帶＋增高墊／兒童座椅。</span>'
          }.items(): repl(old,new,'prep copy')

          p.write_text(s,encoding='utf-8')
          PY
          grep -q "function syncNav" v2.html
          grep -q "清除所有「吃過」紀錄" v2.html
          grep -q "前一天下午 15:00–17:00" v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2.html
          git commit -m 'Polish V2 mobile usability after UX audit'
          git push
