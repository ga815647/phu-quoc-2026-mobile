name: onbird-dd-followup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/onbird-dd-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply accepted OnBird + optional DD follow-up
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          hp = Path('index.html')
          jp = Path('assets/page-kjCTkZIS.js')
          mp = Path('SITE_SYNC_MANIFEST.json')
          html = hp.read_text()
          page = jp.read_text()

          def once(s, old, new, label):
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {c}')
              return s.replace(old, new, 1)

          cable_old = '先吃尚未完成、又有 morning scarcity 的 production Carrier；不再固定 Phụng。Dinh Cậu 只在 chosen breakfast 低摩擦時順停 10–20 分。'
          cable_new = '先吃尚未完成、又有 morning scarcity 的 production Carrier；不再固定 Phụng。早餐後直接往 Ga Ánh Dương；Cable 日不再安排 Dinh Cậu 或其他 DD 停留。'
          html = once(html, cable_old, cable_new, 'HTML Cable breakfast/DD')
          page = once(page, cable_old, cable_new, 'PAGE Cable breakfast/DD')

          hc = html.count('🤿 OnBird')
          pc = page.count('🤿 OnBird')
          if hc < 2 or pc < 2:
              raise SystemExit(f'OnBird labels: expected >=2 rendered occurrences; html={hc}, page={pc}')
          html = html.replace('🤿 OnBird', '🤿 OnBird + optional DD')
          page = page.replace('🤿 OnBird', '🤿 OnBird + optional DD')

          summary_old = '10/11 Morning 已確認並付訂金；South Phu Quoc soft-adventure，Max 10 pax，1 adult + 1 kid，Cosy 往返。'
          summary_new = '10/11 Morning 已確認並付訂金；South Phu Quoc soft-adventure，Max 10 pax，1 adult + 1 kid，Cosy 往返。回 Cosy 休息後，狀態正常才接 optional DD evening。'
          html = once(html, summary_old, summary_new, 'HTML OnBird summary')
          page = once(page, summary_old, summary_new, 'PAGE OnBird summary')

          tail_old = '晚餐留住宿圈，不接固定 show。'
          tail_new = '先洗澡休息；若回程正常、孩子狀態 Green，再接 Dinh Cậu／河口＋DD 吃飯／夜市快閃；累就留 Cosy／Long Beach。'
          html = once(html, tail_old, tail_new, 'HTML OnBird DD tail')
          page = once(page, tail_old, tail_new, 'PAGE OnBird DD tail')

          callout_old = '這是 10/11 protected Card，不再做 Morning／Afternoon 比較。海況與 onsite safety gate 仍可改變當日 execution；不臨時換另一家船。'
          callout_new = '這是 10/11 protected Card，不再做 Morning／Afternoon 比較。海況與 onsite safety gate 仍可改變當日 execution；不臨時換另一家船。DD evening 是 optional tail，不是 OnBird 成功條件。'
          html = once(html, callout_old, callout_new, 'HTML OnBird callout')
          page = once(page, callout_old, callout_new, 'PAGE OnBird callout')

          rule_old = '10/11 Morning confirmed；前一日只收 actual pickup window／daily sea-condition go 或 reschedule，現場保留 safety assessment。'
          rule_new = '10/11 Morning confirmed；前一日只收 actual pickup window／daily sea-condition go 或 reschedule，現場保留 safety assessment；回程後再看時間與 child Green 決定 optional DD evening。'
          html = once(html, rule_old, rule_new, 'HTML OnBird T-72 rule')
          page = once(page, rule_old, rule_new, 'PAGE OnBird T-72 rule')

          hp.write_text(html)
          jp.write_text(page)

          manifest = json.loads(mp.read_text())
          manifest['followup_patch_id'] = 'PHQ-SITE-STAGING-ONBIRD-DD-2026-09-04-01'
          manifest['followup_patch_scope'] = 'PUBLIC_GITHUB_PAGES_STAGING_ONLY'
          manifest['onbird_card'] = 'ONBIRD_PLUS_OPTIONAL_DD_EVENING'
          manifest['cable_day_dd'] = 'BREAKFAST_ONLY_NO_DINH_CAU_MICROSTOP'
          manifest['canonical_cutover'] = False
          mp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          for text in [
              '🤿 OnBird + optional DD',
              'Cable 日不再安排 Dinh Cậu 或其他 DD 停留',
              'Dinh Cậu／河口＋DD 吃飯／夜市快閃',
              'DD evening 是 optional tail，不是 OnBird 成功條件',
          ]:
              if text not in html or text not in page:
                  raise SystemExit(f'missing accepted marker: {text}')
          if 'Dinh Cậu 只在 chosen breakfast 低摩擦時順停 10–20 分' in html or 'Dinh Cậu 只在 chosen breakfast 低摩擦時順停 10–20 分' in page:
              raise SystemExit('stale Cable Dinh Cau micro-stop remains')
          print('PATCH_ASSERTIONS=PASS')
          PY

      - name: Commit staging follow-up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/page-kjCTkZIS.js SITE_SYNC_MANIFEST.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git commit -m 'Update OnBird optional DD and simplify Cable morning'
          git push origin HEAD:main

      - name: Verify public Pages staging
        run: |
          set -euo pipefail
          base='https://ga815647.github.io/phu-quoc-2026-mobile'
          ok=0
          for i in $(seq 1 24); do
            echo "Attempt $i"
            if curl -fsSL --retry 2 --connect-timeout 10 "$base/?sync=PHQ-SITE-STAGING-ONBIRD-DD-2026-09-04-01-$i" -o /tmp/live.html; then
              asset=$(grep -o './assets/page-[A-Za-z0-9_-]*\.js' /tmp/live.html | head -1 | sed 's#^\./##')
              if [ -n "$asset" ]; then
                curl -fsSL --retry 2 "$base/$asset?sync=PHQ-SITE-STAGING-ONBIRD-DD-2026-09-04-01-$i" -o /tmp/page.js || true
                if grep -q '🤿 OnBird + optional DD' /tmp/live.html \
                   && grep -q 'Cable 日不再安排 Dinh Cậu 或其他 DD 停留' /tmp/live.html \
                   && grep -q 'DD evening 是 optional tail，不是 OnBird 成功條件' /tmp/live.html \
                   && grep -q '🤿 OnBird + optional DD' /tmp/page.js \
                   && grep -q 'Dinh Cậu／河口＋DD 吃飯／夜市快閃' /tmp/page.js \
                   && ! grep -q 'Dinh Cậu 只在 chosen breakfast 低摩擦時順停 10–20 分' /tmp/live.html \
                   && ! grep -q 'Dinh Cậu 只在 chosen breakfast 低摩擦時順停 10–20 分' /tmp/page.js; then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          echo 'LIVE_STAGING_VERIFY=PASS'
