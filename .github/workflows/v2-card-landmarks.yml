name: V2 card landmarks patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-card-landmarks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Day Card landmark links
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('v2.html')
          html=p.read_text()
          if '<!-- DAY_CARD_LANDMARKS_V2 -->' in html:
              raise SystemExit('landmarks patch already applied')
          css_old='.callout.red{background:#f7e8e6;color:#81443e}\n.food-guide'
          css_new='.callout.red{background:#f7e8e6;color:#81443e}.landmarks{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 4px}.place-link{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:11px;font-weight:850;color:var(--brand)}.place-note{width:100%;padding:9px 10px;border-radius:11px;background:#f4f2ec;color:#6f675c;font-size:11px}\n.food-guide'
          if css_old not in html:
              raise SystemExit('css anchor missing')
          html=html.replace(css_old,css_new,1)
          def link(label,query):
              return f'<a class="place-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query={query}">📍 {label} · 地圖</a>'
          cable='<div class="landmarks">'+link('Cosy Bungalow Phú Quốc','Cosy+Bungalow+Phu+Quoc')+link('Ga Ánh Dương','Ga+Anh+Duong+Phu+Quoc')+link('Chợ An Thới','Cho+An+Thoi+Phu+Quoc')+link('Sunset Town Phú Quốc','Sunset+Town+Phu+Quoc')+link('Kiss Bridge / Cầu Hôn','Kiss+Bridge+Phu+Quoc')+'</div>'
          vin='<div class="landmarks">'+link('Cosy Bungalow Phú Quốc','Cosy+Bungalow+Phu+Quoc')+link('VinWonders Phú Quốc','VinWonders+Phu+Quoc')+link('The Sea Shell','The+Sea+Shell+VinWonders+Phu+Quoc')+link('Grand World Phú Quốc','Grand+World+Phu+Quoc')+'</div>'
          onbird='<div class="landmarks">'+link('Cosy Bungalow Phú Quốc','Cosy+Bungalow+Phu+Quoc')+link('Dinh Cậu','Dinh+Cau+Temple+Phu+Quoc')+'</div>'
          star='<div class="landmarks">'+link('Cosy Bungalow Phú Quốc','Cosy+Bungalow+Phu+Quoc')+'<div class="place-note">📍 Rạch Vẹm / Hàm Rồng：精確上船點等 T−48 / T−24 gate 確認 operator boarding pin；現在不放模糊導航點。</div></div>'
          safari='<div class="landmarks">'+link('Cosy Bungalow Phú Quốc','Cosy+Bungalow+Phu+Quoc')+link('Vinpearl Safari Phú Quốc','Vinpearl+Safari+Phu+Quoc')+link('Gành Dầu','Ganh+Dau+Phu+Quoc')+link('Grand World Phú Quốc','Grand+World+Phu+Quoc')+'</div>'
          reps=[
              ('<div class="inside"><div class="timeline"><div class="step"><div class="time">07:00–08:15</div>', '<div class="inside">'+cable+'<div class="timeline"><div class="step"><div class="time">07:00–08:15</div>'),
              ('<div class="inside"><div class="timeline"><div class="step"><div class="time">Breakfast</div>', '<div class="inside">'+vin+'<div class="timeline"><div class="step"><div class="time">Breakfast</div>'),
              ('<div class="inside"><div class="timeline"><div class="step"><div class="time">−90m</div>', '<div class="inside">'+onbird+'<div class="timeline"><div class="step"><div class="time">−90m</div>'),
              ('<div class="inside"><ul class="mini-list">', '<div class="inside">'+star+'<ul class="mini-list">'),
              ('<div class="inside"><div class="timeline"><div class="step"><div class="time">07:55–08:10</div>', '<div class="inside">'+safari+'<div class="timeline"><div class="step"><div class="time">07:55–08:10</div>')
          ]
          for old,new in reps:
              if old not in html:
                  raise SystemExit('card anchor missing: '+old[:70])
              html=html.replace(old,new,1)
          html=html.replace('<section class="section" id="cards">','<!-- DAY_CARD_LANDMARKS_V2 -->\n<section class="section" id="cards">',1)
          if html.count('class="place-link"') < 16:
              raise SystemExit('landmark link count too low')
          for required in ['Ga Ánh Dương','VinWonders Phú Quốc','The Sea Shell','Dinh Cậu','Vinpearl Safari Phú Quốc','精確上船點等']:
              if required not in html:
                  raise SystemExit('missing '+required)
          p.write_text(html)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2.html
          git commit -m 'Add landmark map links to V2 day cards'
          git push
